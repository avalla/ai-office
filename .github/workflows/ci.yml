name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Cache Bun package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.6-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.6-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run project checks
        run: bun run check

      - name: Check whitespace errors
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            git diff-tree --check --root -r "${{ github.sha }}"
          else
            git diff --check "${{ github.event.before }}...${{ github.sha }}"
          fi

  queue-e2e:
    name: Redis queue E2E
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install Redis
        run: |
          sudo apt-get update
          sudo apt-get install -y redis-server
          command -v redis-server
          redis-server --version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run mandatory real Redis queue E2E
        run: |
          if ! command -v redis-server >/dev/null 2>&1; then
            echo "redis-server is required for the durable queue E2E" >&2
            exit 1
          fi
          bunx --bun vitest run tests/e2e/durable-queue-orchestration.test.ts

  macos-validate:
    name: macOS validate
    # macOS is a first-class target, so the whole repository validation runs on
    # a real macOS host. Every launchctl call in the test suite is answered by a
    # fake; the plist step additionally checks the generated LaunchAgents with
    # Apple's own parser, which the TypeScript suite cannot do.
    #
    # It deliberately does not bootstrap anything: a GitHub-hosted runner has no
    # interactive Aqua session, so loading a LaunchAgent there would prove
    # nothing and fail unpredictably. Nothing persistent is installed.
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Cache Bun package downloads
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-1.3.6-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-1.3.6-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run project checks
        run: bun run check

      - name: Validate generated LaunchAgent plists with plutil
        run: bun run validate:launchd-plists

  bun-link-smoke:
    name: Bun link smoke (${{ matrix.bun-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bun-version: ["1.3.6", "latest"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Verify isolated source linking
        run: bun run smoke:bun-link
