name: SurrealDB storage experiments

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  surrealdb-experiments:
    name: SurrealDB storage and concurrency experiments
    runs-on: ubuntu-latest
    services:
      surrealdb:
        image: surrealdb/surrealdb:v3.3.0
        ports:
          - 8000:8000
        command: start --user root --pass root memory --bind 0.0.0.0:8000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Bounded health gate: never fails the job. If SurrealDB is unavailable the
      # server-dependent test step is skipped below and the skip is recorded
      # explicitly. GitHub Actions has no neutral/skipped outcome for a started
      # job, so an infrastructure outage must not be reported as green tests.
      - name: Wait for SurrealDB
        id: surrealdb-gate
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 2
          done
          echo "available=false" >> "$GITHUB_OUTPUT"

      # Fake-wire SDK auth-lifecycle suite (token expiry, signin replay after
      # reconnect): runs against its own loopback fake server, so it runs
      # regardless of SurrealDB availability.
      - name: Run SurrealDB auth lifecycle tests
        run: bunx --bun vitest run tests/integration/agent-knowledge-surrealdb-auth-lifecycle.test.ts

      - name: Run server-dependent SurrealDB test suites
        if: steps.surrealdb-gate.outputs.available == 'true'
        env:
          AI_OFFICE_TEST_SURREALDB_URL: ws://127.0.0.1:8000
        run: >-
          bunx --bun vitest run
          tests/integration/agent-knowledge-surrealdb.test.ts
          tests/integration/storage-contracts-surrealdb.test.ts
          tests/integration/surrealdb-concurrency-experiment.test.ts
          tests/unit/surrealdb-concurrency-experiment.test.ts

      # Fail-closed skip record: the token expiry/reconnect behavior stays
      # uncovered on a real server by design — a live SurrealDB cannot be forced
      # to expire tokens — and is covered at SDK level by the fake-wire
      # auth-lifecycle suite, which this job runs unconditionally.
      - name: Record explicit SurrealDB skip
        if: steps.surrealdb-gate.outputs.available != 'true'
        run: |
          {
            echo "## Server-dependent SurrealDB suites skipped (fail-closed)"
            echo ""
            echo "SurrealDB was unavailable on this runner; the fake-wire auth-lifecycle suite still ran."
            echo "No server-dependent tests were executed. Token expiry/reconnect coverage is SDK-level (fake-wire) by design."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::SurrealDB unavailable on this runner — server-dependent SurrealDB suites skipped (fail-closed); the fake-wire auth-lifecycle suite still ran"
