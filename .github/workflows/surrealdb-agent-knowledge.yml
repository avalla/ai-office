name: SurrealDB AgentKnowledgeStore experiment

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  surrealdb-agent-knowledge:
    name: SurrealDB knowledge graph integration
    runs-on: ubuntu-latest
    services:
      surrealdb:
        image: surrealdb/surrealdb:v3.3.0
        ports:
          - 8000:8000
        options: >-
          --health-cmd "/surreal is-ready --endpoint http://localhost:8000"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
        command: start --user root --pass root memory --bind 0.0.0.0:8000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.6"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run SurrealDB AgentKnowledgeStore integration tests
        env:
          AI_OFFICE_TEST_SURREALDB_URL: ws://127.0.0.1:8000
        run: bunx --bun vitest run tests/integration/agent-knowledge-surrealdb.test.ts
