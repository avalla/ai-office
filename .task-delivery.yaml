# Project settings for the task-delivery skill (skills/task-delivery).
# Contract: skills/task-delivery/references/configuration.md

integration_branch: main

verification:
  full: bun run check
  targeted: bunx --bun vitest run <test files>

git:
  worktree_required: true
  stacking_allowed: true

external_review:
  # {base} is the branch the task's pull request targets.
  command: codex review --base origin/{base}

task_lifecycle:
  enabled: true
  # {task} is the task's identifier in AI Office. Each command runs in a
  # subshell from the primary checkout, the one bound to the Runtime: a task
  # worktree is not bound and would be refused. No --project is given: the CLI
  # resolves the project from that checkout, and a project id is local to one
  # Runtime. The subshell keeps the caller's working directory unchanged.
  # These commands use the installed ai-office entry point on purpose: this
  # project's delivery tasks live in the Runtime this checkout is bound to,
  # where AI-OFFICE.md tells contributors to run ai-office. A checkout that
  # tracks work in an isolated development Runtime needs different commands.
  # To read a task's current state, run the same form with
  # "task:transitions --task {task} --json".
  start: '(cd "$(git rev-parse --path-format=absolute --git-common-dir)/.." && ai-office task:start --task {task})'
  review: '(cd "$(git rev-parse --path-format=absolute --git-common-dir)/.." && ai-office task:submit-review --task {task})'
  complete: '(cd "$(git rev-parse --path-format=absolute --git-common-dir)/.." && ai-office task:complete --task {task})'
