# Project settings for the task-delivery skill (skills/task-delivery).
# Contract: skills/task-delivery/references/configuration.md

integration_branch: main

verification:
  full: bun run check
  targeted: bunx --bun vitest run <test files>

git:
  worktree_required: true
  stacking_allowed: true

external_review:
  # {base} is the branch the task's pull request targets.
  command: codex review --base origin/{base}

task_lifecycle:
  enabled: true
  # {task} is the task's identifier in AI Office. The commands run from the
  # primary checkout, which is the one bound to the Runtime: a task worktree is
  # not, and the same command would be refused there.
  start: 'cd "$(git rev-parse --path-format=absolute --git-common-dir)/.." && ai-office task:start --task {task}'
  review: 'cd "$(git rev-parse --path-format=absolute --git-common-dir)/.." && ai-office task:submit-review --task {task}'
  complete: 'cd "$(git rev-parse --path-format=absolute --git-common-dir)/.." && ai-office task:complete --task {task}'
