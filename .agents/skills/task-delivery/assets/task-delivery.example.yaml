# Copy to the repository root as .task-delivery.yaml and adjust.
# Every key is optional; see references/configuration.md for defaults and for
# when a value must be wrapped in double quotes.

integration_branch: main

verification:
  full: "<command that runs the whole check suite>"
  targeted: "<command that runs a narrow test selection>"

git:
  worktree_required: false
  stacking_allowed: false

external_review:
  command: "<command that runs the external reviewer>"

# Leave task_lifecycle out to let the project's own instructions decide
# whether task state is tracked. "enabled: false" switches it off for good.
# task_lifecycle:
#   enabled: true
#   start: "<command that marks {task} as started>"
#   review: "<command that marks {task} as in review>"
#   complete: "<command that marks {task} as done>"
