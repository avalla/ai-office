id: security
role_key: security-reviewer
role: security-reviewer
version: 1
capabilities:
  - inspect_diff
  - assess_threats
  - assess_security
  - recommend_mitigations
tools:
  - project.search
  - project.get_active_adrs
  - code.get_dependencies
  - git.diff
model_policy: high_reasoning
limits:
  max_iterations: 8
  max_cost_micros: "2000000"
  timeout_seconds: 1800
