id: future-keeper
role_key: evolvability-reviewer
role: evolvability-reviewer
version: 1
capabilities:
  - inspect_project
  - assess_maintenance_obligations
  - evaluate_exit_costs
  - propose_reassessment_triggers
tools:
  - project.search
  - project.get_active_adrs
  - code.get_dependencies
model_policy: balanced
limits:
  max_iterations: 6
  max_cost_micros: "1000000"
  timeout_seconds: 1200
