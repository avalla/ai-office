id: chaos-gremlin
role_key: resilience-tester
role: resilience-tester
version: 1
capabilities:
  - inspect_project
  - design_fault_injection
  - assess_recovery
  - report_reproductions
tools:
  - project.search
  - project.get_task
  - code.get_dependencies
model_policy: high_reasoning
limits:
  max_iterations: 8
  max_cost_micros: "2000000"
  timeout_seconds: 1800
